<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TickerWatcher - Error</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0a0e27;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .error-container {
            background-color: #1a1f35;
            border: 1px solid #ff3333;
            border-radius: 8px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
        }

        .error-title {
            font-size: 24px;
            font-weight: 600;
            color: #ff3333;
            margin-bottom: 15px;
        }

        .error-message {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .back-button {
            background-color: #00d84f;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }

        .back-button:hover {
            background-color: #00b83a;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-title">⚠️ Error</div>
        <div class="error-message">{{ error }}</div>
        <a href="{{ url_for('index') }}" class="back-button">Go Back to Home</a>
    </div>
</body>
</html>
